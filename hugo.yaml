baseURL: https://marshallford.me/
title: Marshall Ford
locale: en-US
enableRobotsTXT: true
disableHugoGeneratorInject: true

params:
  tagline: Platform Engineer  # second half of the hero headline and the title
  description: Platform engineer with deep expertise in site reliability and DevSecOps.
  themeColor: '#22292b' # sRGB of Tailwind's mist-800, unresolvable outside CSS
  social:
  - name: GitHub
    link: https://github.com/marshallford
    icon: github
  - name: Instagram
    link: https://www.instagram.com/marshallbford
    icon: instagram
  - name: LinkedIn
    link: https://www.linkedin.com/in/marshallbford
    icon: linkedin-in
  - name: Email
    link: mailto:inbox@marshallford.me
    icon: inbox

disableKinds:
- sitemap
- taxonomy
- term
- RSS

outputs:
  home:
  - html
  - webappmanifest

minify:
  disableCSS: true

imaging:
  resampleFilter: lanczos
  avif:
    quality: 75
    hint: photo

build:
  buildStats:
    enable: true
  cachebusters:
  - source: assets/notwatching/hugo_stats\.json
    target: css
  - source: assets/.*\.css
    target: css

security:
  exec:
    allow:
    - ^node$
    - ^tailwindcss$
  node:
    permissions:
      allowRead:
      - node_modules
      - hugo_stats.json

module:
  mounts:
  - source: assets
    target: assets
  - source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json
    disableWatch: true
