- title: Terraform Provider for pfSense
  pills:
  - text: source
    link: https://github.com/marshallford/terraform-provider-pfsense
    icon: git-alt
  - text: registry
    link: https://registry.terraform.io/providers/marshallford/pfsense/latest/docs
    icon: link
  body: >-
    Configure pfSense firewall/router devices with Terraform. Written in Go with the Terraform
    Plugin Framework.

- title: Terraform Provider for Ansible
  pills:
  - text: source
    link: https://github.com/marshallford/terraform-provider-ansible
    icon: git-alt
  - text: registry
    link: https://registry.terraform.io/providers/marshallford/ansible/latest/docs
    icon: link
  body: >-
    Run Ansible playbooks using Terraform, without the local-exec provisioner. Supports execution
    environments and jq queries against playbook artifacts, among other features. Written in Go,
    with acceptance tests and published coverage reports. GitHub Actions is used for CI/CD.

- title: K3s Cluster Terraform Module
  pills:
  - text: source
    link: https://github.com/marshallford/terraform-ansible-k3s
    icon: git-alt
  - text: registry
    link: https://registry.terraform.io/modules/marshallford/k3s/ansible/latest
    icon: link
  body: >-
    Provision and operate a Kubernetes cluster with the convenience of a managed offering. Targets
    Fedora CoreOS, with SELinux support and Butane submodules for machine configuration. Highly
    available control plane via HAProxy and Keepalived. Supports air-gapped installs, upgrades, and
    certificate rotation. Built on my Ansible provider and used for my homelab clusters.

- title: Home Automation
  pills:
  - text: homelab
    icon: dot-circle
  body: >-
    Fedora CoreOS VM provisioned on Proxmox with Terraform and configured with Ansible. All
    workloads run as Podman Quadlets. Zigbee2MQTT bridges devices from an SLZB-MR2 network-attached
    coordinator to Home Assistant over Mosquitto. Caddy runs rootless with systemd socket activation
    and terminates HTTPS with certificates from lego.

- title: Cooling a Closet Homelab
  pills:
  - text: source
    link: https://github.com/marshallford/closet-homelab-telemetry
    icon: git-alt
  body: >-
    Measured whether two USB fans actually helped. Uses an OpenTelemetry Collector, Prometheus, and
    Grafana, with dashboards generated from Jsonnet. Scripts mark changes and compare the windows on
    either side.

- title: Personal Website
  pills:
  - text: source
    link: https://github.com/marshallford/marshallford.me
    icon: git-alt
  body: >-
    This very website. Rendered with Hugo and styled with Tailwind CSS. Pages are precompressed with
    Brotli and served by Caddy from a reproducible, signed container image with an SBOM. Deployed to
    GCP Cloud Run with Terraform. CI/CD with GitHub Actions includes Lighthouse audits and security
    scans.
