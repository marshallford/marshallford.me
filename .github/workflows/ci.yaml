name: CI

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
    - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Verify actions lockfile
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh extension install github/gh-actions-lock --pin v0.4.1
        gh actions-lock --verify
    - name: Read Terraform version
      id: terraform-version
      uses: $/.github/actions/terraform-version
      with:
        path: terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4.0.1
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
        terraform_wrapper: false
    - name: Setup node
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Pull
      run: make -j pull/editorconfig pull/yamllint pull/checkov pull/trivy
    - name: Lint
      run: make lint
    - name: Build container image
      uses: $/.github/actions/container-image
      with:
        image: marshallford-me
        tags: ci
        build-args: HUGO_PARAMS_COMMIT=${{ github.sha }}
    - name: Scan
      run: make --assume-old=build/container scan
    - name: Test
      run: make --assume-old=build/container test
