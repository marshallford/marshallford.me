ci:
  collect:
    numberOfRuns: 3
    startServerCommand: make --assume-old=build/container serve/container
    startServerReadyPattern: serving initial configuration
    url:
    - http://localhost:8080/
    - http://localhost:8080/media-kit/
  assert:
    assertMatrix:
    - assertions:
        categories:performance:
        - error
        - minScore: 0.98
        categories:accessibility:
        - error
        - minScore: 1
        categories:best-practices:
        - error
        - minScore: 1
        resource-summary:third-party:count:
        - error
        - maxNumericValue: 0
    - matchingUrlPattern: ^(?!.*/media-kit/)
      assertions:
        categories:seo:
        - error
        - minScore: 1
